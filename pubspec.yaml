name: soundwave
description: SoundWave - Aplikasi Manajemen Konser Musik Modern
publish_to: 'none'
version: 2.4.7+31

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  intl: ^0.18.1
  qr_flutter: ^4.1.0
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  cloud_functions: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^18.0.1
  mobile_scanner: ^6.0.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  google_sign_in: ^6.2.2
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  http: ^1.6.0
  path: ^1.9.0
  image_picker: ^1.1.2
  timezone: ^0.10.0
  crypto: ^3.0.3
  cryptography: ^2.9.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
